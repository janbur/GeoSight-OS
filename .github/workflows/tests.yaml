name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, version-2.0.0 ]

jobs:
  flake8_py3:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          architecture: x64
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Display branch
        run: git branch --show-current

      - name: Install flake8
        run: pip install flake8 flake8-docstrings pydoclint[flake8]

      - name: Run flake8 on changed/untracked Python files
        run: |
          files=$(
            { git diff --name-only origin/main...HEAD;
              git ls-files --others --exclude-standard;
            } | grep '\.py$' | sort -u
          )
          echo "Changed/untracked Python files:"
          echo "$files"
          if [ -n "$files" ]; then
            flake8 $files
          else
            echo "No Python files to lint."
          fi

  build_image:
    needs: flake8_py3
    name: Build Docker Image
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: unicef/geosight:dev
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Display branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          echo "Repository: $REPO"
          echo "Branch: $BRANCH"
          git log -1 --oneline

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: false
          load: true
          target: dev
          tags: ${{ env.APP_IMAGE }}
          no-cache: true

      - name: Save Docker Image as Tar File
        run: docker save -o /tmp/my-image.tar ${{ env.APP_IMAGE }}

      - name: Upload Docker Image Cache
        uses: actions/cache@v3
        with:
          path: /tmp/my-image.tar
          key: ${{ runner.os }}-docker-image-${{ github.sha }}

      - name: ✅ Check GDAL version inside geosight_dev
        run: |
          docker run --rm --entrypoint "" unicef/geosight:dev sh -c '\
            VERSION=$(gdalinfo --version | awk '\''{print $2}'\'') && \
            echo "GDAL version: $VERSION" && \
            if [ "$(printf "%s\n" "3.0.9" "$VERSION" | sort -V | head -n1)" = "3.0.9" ] && [ "$VERSION" != "3.0.9" ]; then \
              echo "✅ GDAL version is greater than 3.0.9"; \
            else \
              echo "❌ GDAL version is NOT greater than 3.0.9"; exit 1; \
            fi'

  django_app_tests:
    needs: build_image
    name: Django App Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # DIAGNOSTIC (fork only, never upstream): bookmark map mode (item 19)
        test_suite: [
          { id: "e2e-project-bookmark-embed-a", mode: "e2e", path: "tests/admin/project_bookmark_embed/", workers: 3, script: "make load-test-data" },
          { id: "e2e-project-bookmark-embed-b", mode: "e2e", path: "tests/admin/project_bookmark_embed/", workers: 3, script: "make load-test-data" },
          { id: "e2e-project-bookmark-embed-c", mode: "e2e", path: "tests/admin/project_bookmark_embed/", workers: 3, script: "make load-test-data" },
        ]
    env:
      APP_IMAGE: unicef/geosight
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Display branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          echo "Repository: $REPO"
          echo "Branch: $BRANCH"
          git log -1 --oneline

      - name: Restore Docker Image from Cache
        uses: actions/cache@v3
        with:
          path: /tmp/my-image.tar
          key: ${{ runner.os }}-docker-image-${{ github.sha }}

      - name: Load Docker Image
        run: docker load -i /tmp/my-image.tar

      - name: Run docker-compose services
        run: |
          ./setup.sh
          cd deployment
          echo "Override docker-compose.test.yml for testing purposes"
          cp docker-compose.test.yml docker-compose.override.yml
          if [ -n "${{ matrix.test_suite.plugins }}" ]; then
            sed -i 's/- PLUGINS=tenants,reference_dataset,cloud_native_gis/- PLUGINS=${{ matrix.test_suite.plugins }}/g' docker-compose.override.yml
          fi
          if [ -n "${{ matrix.test_suite.initial_default_data }}" ]; then
            sed -i 's/- INITIAL_DEFAULT_DATA=""/- INITIAL_DEFAULT_DATA=true/g' docker-compose.override.yml
          fi
          cd ../
          make dev-ci-test
          make wait-db

      - name: Environments
        run: |
          grep -A 1000 'environment:' deployment/docker-compose.override.yml | grep '^\s*-' | head -100

      - name: Backend (Prepare container and test)
        if: ${{ matrix.test_suite.mode == 'backend' }}
        run: |
          make dev-initialize
          make dev-test

      - name: E2E (Prepare container)
        if: ${{ matrix.test_suite.mode == 'e2e' }}
        run: |
          make dev-initialize
          docker exec -d geosight_dev bash -c "python manage.py runserver 0.0.0.0:2000 > /tmp/runserver.log 2>&1"
          ${{ matrix.test_suite.script }}
          make sleep

      - name: E2E (Test production ready)
        if: ${{ matrix.test_suite.mode == 'e2e' }}
        run: |
          make production-check
          curl http://localhost:2000/
          if [ $? -ne 0 ]; then
            echo "Curl command failed"
            exit 1
          fi

      - name: E2E (Test)
        if: ${{ matrix.test_suite.mode == 'e2e' }}
        working-directory: ./playwright/ci-test
        run: |
          npm install
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test ${{ matrix.test_suite.path }} --workers ${{ matrix.test_suite.workers }}

      - name: Collect server logs
        if: always()
        run: |
          mkdir -p playwright/ci-test/playwright-results/server-logs
          docker cp geosight_dev:/tmp/runserver.log playwright/ci-test/playwright-results/server-logs/runserver.log || true
          for c in geosight_dev geosight_worker geosight_db; do
            docker logs $c > playwright/ci-test/playwright-results/server-logs/$c.log 2>&1 || true
          done
          grep -n -E '" 5[0-9][0-9] |Traceback|Internal Server Error' playwright/ci-test/playwright-results/server-logs/runserver.log | head -50 || true

      - name: Upload Playwright Screenshots
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: playwright-screenshots-${{ matrix.test_suite.id }}
          path: playwright/ci-test/playwright-results/
